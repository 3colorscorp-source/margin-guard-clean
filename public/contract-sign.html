<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Contract</title>
  <style>
    :root {
      --bg: #eef2f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #0f8a5f;
      --soft: #f9fafb;
      --danger: #991b1b;
      --danger-bg: #fee2e2;
      --warn: #92400e;
      --warn-bg: #fef3c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 14px 48px;
      line-height: 1.5;
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.07);
    }
    .toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: var(--soft); }
    .header {
      padding: 28px 28px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 18px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 8px;
      background: var(--soft);
      border: 1px solid var(--line);
    }
    .biz-name {
      font-size: 1.45rem;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }
    .muted { color: var(--muted); font-size: 0.92rem; }
    .section {
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
    }
    .section:last-child { border-bottom: none; }
    .section h2 {
      margin: 0 0 10px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .section h3 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 18px;
    }
    .kv { font-size: 0.95rem; }
    .kv .k { display: block; color: var(--muted); font-size: 0.78rem; font-family: "Segoe UI", Arial, sans-serif; }
    .pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      font: inherit;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-family: "Segoe UI", Arial, sans-serif;
      font-weight: 600;
    }
    .status-banner {
      padding: 14px 28px;
      border-bottom: 1px solid var(--line);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 0.92rem;
    }
    .status-banner.ok { background: #ecfdf5; color: #065f46; }
    .status-banner.bad { background: var(--danger-bg); color: var(--danger); }
    .status-banner.warn { background: var(--warn-bg); color: var(--warn); }
    .placeholder {
      margin-top: 12px;
      padding: 18px;
      border: 2px dashed var(--line);
      border-radius: 10px;
      background: var(--soft);
      color: var(--muted);
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
    }
    .error-panel {
      max-width: 560px;
      margin: 48px auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
    }
    .error-panel h1 { margin: 0 0 8px; font-size: 1.3rem; }
    .notice-item { margin: 0 0 12px; }
    .notice-item strong {
      display: block;
      font-size: 0.92rem;
      margin-bottom: 2px;
    }
    .loading {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    @media (max-width: 640px) {
      body { padding: 12px 10px 36px; }
      .header, .section, .status-banner { padding-left: 16px; padding-right: 16px; }
      .grid { grid-template-columns: 1fr; }
      .biz-name { font-size: 1.2rem; }
    }
    @media print {
      body { background: #fff; padding: 0; }
      .toolbar, .no-print { display: none !important; }
      .card { box-shadow: none; border: none; border-radius: 0; }
      .placeholder { border-style: solid; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="loading" id="loading">Loading contract…</div>
  </div>

  <script>
(function () {
  "use strict";

  var NOTICE_LABELS = {
    contract: "Contract",
    payment: "Payment",
    change_order: "Change Order",
    cancellation: "Cancellation",
    warranty: "Warranty",
    limitation_of_liability: "Limitation of Liability",
    permit: "Permits",
    site_conditions: "Site Conditions",
    cleanup: "Cleanup",
    material: "Materials",
    dispute: "Dispute Resolution",
    force_majeure: "Force Majeure",
    governing_law: "Governing Law",
    additional_terms: "Additional Terms"
  };

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function text(value) {
    var s = String(value == null ? "" : value).trim();
    return s ? escapeHtml(s) : "—";
  }

  function money(amount, currency) {
    var n = Number(amount);
    if (!Number.isFinite(n)) return "—";
    try {
      return new Intl.NumberFormat(undefined, {
        style: "currency",
        currency: currency || "USD"
      }).format(n);
    } catch (_e) {
      return String(n);
    }
  }

  function formatDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (Number.isNaN(d.getTime())) return escapeHtml(String(iso));
    return escapeHtml(d.toLocaleString(undefined, {
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }));
  }

  function readTokenFromQuery() {
    try {
      var params = new URLSearchParams(window.location.search || "");
      return String(params.get("token") || "").trim();
    } catch (_e) {
      return "";
    }
  }

  function showError(title, message) {
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="error-panel">' +
      "<h1>" + escapeHtml(title) + "</h1>" +
      '<p class="muted">' + escapeHtml(message) + "</p>" +
      "</div>";
    document.title = "Contract unavailable";
  }

  function propertyLines(property) {
    if (!property) return "—";
    var parts = [
      property.address_line1,
      property.address_line2,
      [property.city, property.state, property.postal_code].filter(Boolean).join(", ")
    ].filter(Boolean);
    if (!parts.length && property.quote_project_address) {
      parts.push(property.quote_project_address);
    }
    if (!parts.length && property.quote_job_site) {
      parts.push(property.quote_job_site);
    }
    return parts.length ? escapeHtml(parts.join("\n")).replace(/\n/g, "<br>") : "—";
  }

  function renderNotices(legal) {
    var notices = (legal && legal.notices) || {};
    var enabled = (legal && legal.enabled) || {};
    var keys = Object.keys(NOTICE_LABELS);
    var html = "";
    var any = false;
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      if (enabled[key] === false) continue;
      var body = notices[key];
      if (body == null || String(body).trim() === "") continue;
      any = true;
      html +=
        '<div class="notice-item"><strong>' +
        escapeHtml(NOTICE_LABELS[key]) +
        "</strong><div class=\"pre\">" +
        escapeHtml(String(body)) +
        "</div></div>";
    }
    return any ? html : '<p class="muted">No legal notices in this package.</p>';
  }

  function renderSchedule(schedule) {
    var items = (schedule && schedule.items) || [];
    if (!items.length) {
      return '<p class="muted">No payment schedule items.</p>';
    }
    var rows = items.map(function (item) {
      return (
        "<tr>" +
        "<td>" + text(item.sequence_number) + "</td>" +
        "<td>" + text(item.label || item.payment_type) + "</td>" +
        "<td>" + text(item.payment_type) + "</td>" +
        "<td>" + text(item.amount != null ? item.amount : item.percentage != null ? item.percentage + "%" : "") + "</td>" +
        "<td>" + text(item.due_rule || item.milestone || item.fixed_due_date) + "</td>" +
        "</tr>"
      );
    }).join("");
    return (
      "<table><thead><tr>" +
      "<th>#</th><th>Label</th><th>Type</th><th>Amount</th><th>Due</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table>"
    );
  }

  function branding(snap) {
    var b = (snap.business_settings && snap.business_settings.branding) || {};
    var lp = (snap.business_settings && snap.business_settings.legal_profile) || {};
    return {
      name: b.business_name || lp.legal_business_name || lp.dba_name || "Contractor",
      email: b.business_email || lp.business_email || "",
      phone: b.business_phone || lp.business_phone || "",
      address: b.business_address || lp.business_address || "",
      logo: b.logo_url || ""
    };
  }

  function renderContract(payload) {
    var c = payload.contract || {};
    var snap = c.snapshot || {};
    var biz = branding(snap);
    var customer = snap.customer || {};
    var project = snap.project || {};
    var property = snap.property || {};
    var price = snap.price || {};
    var scope = snap.scope || {};
    var warranty = snap.warranty || {};
    var terms = snap.terms || {};
    var legal = snap.legal_notices || {};
    var pkg = c.package || {};
    var env = c.envelope || {};
    var signer = c.signer || {};
    var tokenMeta = c.token || {};

    document.title = biz.name + " — Contract v" + (pkg.version || "");

    var logoHtml = biz.logo
      ? '<img class="logo" alt="" src="' + escapeHtml(biz.logo) + '" />'
      : "";

    var warrantyText = [];
    if (warranty.duration_value && warranty.duration_unit) {
      warrantyText.push(String(warranty.duration_value) + " " + String(warranty.duration_unit));
    }
    if (warranty.summary) warrantyText.push(String(warranty.summary));

    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="toolbar no-print">' +
      '<button type="button" class="btn" id="btnPrint">Print preview</button>' +
      '<button type="button" class="btn" id="btnClose">Close</button>' +
      "</div>" +
      '<div class="card">' +
      '<div class="status-banner ok">' +
      "Status: " + text(env.status) +
      " · Package v" + text(pkg.version) +
      " · Expires " + formatDate(env.expires_at || tokenMeta.expires_at) +
      "</div>" +
      '<div class="header">' +
      logoHtml +
      "<div>" +
      '<p class="biz-name">' + text(biz.name) + "</p>" +
      '<div class="muted">' +
      [biz.address, biz.phone, biz.email].filter(Boolean).map(escapeHtml).join(" · ") +
      "</div>" +
      "</div></div>" +
      '<div class="section"><h2>Contract</h2>' +
      "<h3>" + text((snap.quote && snap.quote.title) || "Service Contract") + "</h3>" +
      '<div class="muted">Version ' + text(pkg.version) +
      " · Frozen " + formatDate(pkg.frozen_at) + "</div></div>" +
      '<div class="section"><h2>Customer / Project / Property</h2>' +
      '<div class="grid">' +
      '<div class="kv"><span class="k">Customer</span>' + text(customer.name) + "</div>" +
      '<div class="kv"><span class="k">Email</span>' + text(customer.email) + "</div>" +
      '<div class="kv"><span class="k">Phone</span>' + text(customer.phone) + "</div>" +
      '<div class="kv"><span class="k">Project</span>' + text(project.name) + "</div>" +
      '<div class="kv" style="grid-column:1/-1"><span class="k">Property</span>' +
      propertyLines(property) +
      "</div></div></div>" +
      '<div class="section"><h2>Scope</h2><div class="pre" id="scopeText"></div></div>' +
      '<div class="section"><h2>Price</h2>' +
      '<div class="grid">' +
      '<div class="kv"><span class="k">Contract total</span>' +
      escapeHtml(money(price.contract_total, price.currency)) + "</div>" +
      '<div class="kv"><span class="k">Deposit required</span>' +
      escapeHtml(money(price.deposit_required, price.currency)) + "</div>" +
      "</div></div>" +
      '<div class="section"><h2>Payment Schedule</h2>' +
      renderSchedule(snap.payment_schedule) +
      "</div>" +
      '<div class="section"><h2>Warranty</h2>' +
      '<div class="pre" id="warrantyText"></div>' +
      '<div id="warrantyExclusions"></div>' +
      "</div>" +
      '<div class="section"><h2>Terms</h2><div class="pre" id="termsText"></div></div>' +
      '<div class="section"><h2>Legal Notices</h2><div id="legalNotices"></div></div>' +
      '<div class="section"><h2>Signer</h2>' +
      '<div class="grid">' +
      '<div class="kv"><span class="k">Name</span>' + text(signer.party_name) + "</div>" +
      '<div class="kv"><span class="k">Email</span>' + text(signer.email) + "</div>" +
      '<div class="kv"><span class="k">Role</span>' + text(signer.role) + "</div>" +
      '<div class="kv"><span class="k">Sign order</span>' + text(signer.sign_order) + "</div>" +
      '<div class="kv"><span class="k">Signer status</span>' + text(signer.status) + "</div>" +
      '<div class="kv"><span class="k">Envelope expires</span>' + formatDate(env.expires_at) + "</div>" +
      "</div>" +
      '<div class="placeholder">Signing available in next step</div>' +
      "</div>" +
      "</div>";

    document.getElementById("scopeText").textContent = scope.text ? String(scope.text) : "—";
    document.getElementById("warrantyText").textContent = warrantyText.length
      ? warrantyText.join("\n")
      : "—";
    var excl = document.getElementById("warrantyExclusions");
    if (warranty.exclusions) {
      excl.innerHTML =
        '<p class="muted" style="margin-top:8px">Exclusions</p><div class="pre"></div>';
      excl.querySelector(".pre").textContent = String(warranty.exclusions);
    }
    document.getElementById("termsText").textContent = terms.quote_terms
      ? String(terms.quote_terms)
      : "—";
    document.getElementById("legalNotices").innerHTML = renderNotices(legal);

    document.getElementById("btnPrint").addEventListener("click", function () {
      window.print();
    });
    document.getElementById("btnClose").addEventListener("click", function () {
      window.close();
      history.back();
    });
  }

  async function main() {
    var token = readTokenFromQuery();
    if (!token) {
      showError("Missing link", "This signing link is incomplete.");
      return;
    }

    // Token stays in query string only — never persisted in browser storage.
    var res;
    try {
      res = await fetch(
        "/.netlify/functions/contract-sign-public?token=" + encodeURIComponent(token),
        { method: "GET", credentials: "omit", cache: "no-store" }
      );
    } catch (_e) {
      showError("Unavailable", "Could not load this contract. Try again later.");
      return;
    }

    var data = {};
    try {
      data = await res.json();
    } catch (_e2) {
      data = {};
    }

    if (!res.ok || !data.ok) {
      var title =
        data.code === "expired" ? "Link expired" :
        data.code === "revoked" ? "Link revoked" :
        data.code === "consumed" ? "Already used" :
        data.code === "envelope_cancelled" ? "Cancelled" :
        data.code === "envelope_declined" ? "Declined" :
        data.code === "envelope_completed" ? "Completed" :
        data.code === "package_void" ? "Void" :
        data.code === "package_superseded" ? "Superseded" :
        "Unavailable";
      showError(title, data.error || "This signing link is invalid or unavailable.");
      return;
    }

    renderContract(data);
  }

  main();
})();
  </script>
</body>
</html>
