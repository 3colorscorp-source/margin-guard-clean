name: Core Security Shield V1

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-security-shield-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-security-shield-v1:
    name: Core Security Shield V1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Core Security scope guard self-test
        run: node scripts/guard-core-security-scope.js --self-test

      - name: Core Security Shield V2 wiring self-test
        run: node scripts/test-core-security-shield-v2.js

      - name: Core Security Shield V1 runner self-test
        run: node scripts/test-mg-core-security-shield-v1-runner.js

      # Real scope guard is skipped on merge_group: that event does not expose a
      # trusted PR title or head branch for Core Security authorization
      # (GITHUB_HEAD_REF is empty; merge_group is not a substitute for PR_TITLE).
      # Authorization requires BOTH the exact title token "[Core Security]" AND a
      # branch prefix feat/core-security- | fix/core-security- | security/core-.
      # Title or branch alone is not enough. Do not set ALLOW_CORE_SECURITY_TOUCH.
      # pull_request passes title, head, and base SHA via env, not shell interpolation.
      # merge_group still runs self-tests and the required Shield suites; it must not treat missing title/branch as authorization.
      - name: Core Security scope guard
        id: guard
        if: github.event_name != 'merge_group'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node scripts/guard-core-security-scope.js | tee "${RUNNER_TEMP}/core-security-guard.txt"
          if grep -q '^CORE_SECURITY_REGRESSION_REQUIRED=1$' "${RUNNER_TEMP}/core-security-guard.txt"; then
            echo "regression_required=1" >> "$GITHUB_OUTPUT"
          else
            echo "regression_required=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Core Security Shield V1 required
        run: node scripts/test-mg-core-security-shield-v1.js

      - name: Core Security Shield V1 full
        run: node scripts/test-mg-core-security-shield-v1.js --full

      - name: Core Security V1 complete (authorized protected change)
        if: github.event_name != 'merge_group' && steps.guard.outputs.regression_required == '1'
        run: |
          node scripts/test-mg-core-security-shield-v1.js
          node scripts/test-mg-core-security-shield-v1.js --full

      - name: Seller scope guard self-test
        run: node scripts/guard-seller-scope.js --self-test

      - name: Owner scope guard self-test
        run: node scripts/guard-owner-scope.js --self-test

      - name: Invoice Hub scope guard self-test
        run: node scripts/guard-invoice-hub-scope.js --self-test

      - name: Seller Shield V1 canonical runner
        run: node scripts/test-mg-seller-shield-v1.js

      - name: Owner Shield V1 canonical runner
        run: node scripts/test-mg-owner-shield-v1.js

      - name: Invoice Hub Shield V2 canonical regression
        env:
          INVOICE_HUB_REGRESSION_REQUIRED: "1"
        run: node scripts/test-invoice-hub-regression-suite.js
