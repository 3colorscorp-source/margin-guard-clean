name: Owner Shield V1

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-shield-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owner-shield-v1:
    name: Owner Shield V1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Runner self-test
        run: node scripts/test-mg-owner-shield-v1-runner.js

      - name: Scope guard self-test
        run: node scripts/guard-owner-scope.js --self-test

      # Real scope guard is skipped on merge_group: that event does not expose a
      # trusted PR title or head branch for Owner authorization (GITHUB_HEAD_REF
      # is empty; merge_group is not a substitute for PR_TITLE). Do not set
      # ALLOW_OWNER_TOUCH=1. pull_request passes title and head via env, not
      # shell interpolation. workflow_dispatch still runs the guard; on main it
      # may report no Owner protected surface changes.
      - name: Owner scope guard
        if: github.event_name != 'merge_group'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/guard-owner-scope.js

      - name: Owner Shield required
        run: node scripts/test-mg-owner-shield-v1.js

      - name: Owner Shield full
        run: node scripts/test-mg-owner-shield-v1.js --full
